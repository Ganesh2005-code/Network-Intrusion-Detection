<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSV Prediction Results</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        table{
            font-size:12px;
            white-space:nowrap;
        }

        th{
            position:sticky;
            top:0;
            background:#0d6efd;
            color:white;
        }

        .card{
            border-radius:12px;
        }

        .table-responsive{
            max-height:600px;
            overflow:auto;
        }

    </style>

</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center text-primary mb-4">
        CSV Prediction Results
    </h2>

    <div class="row text-center mb-4">

        <div class="col-md-4">
            <div class="card bg-primary text-white shadow">
                <div class="card-body">
                    <h5>Total Records</h5>
                    <h2>{{ total }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-success text-white shadow">
                <div class="card-body">
                    <h5>Normal</h5>
                    <h2>{{ normal }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-danger text-white shadow">
                <div class="card-body">
                    <h5>Attack</h5>
                    <h2>{{ attack }}</h2>
                </div>
            </div>
        </div>

    </div>

    <div class="card shadow">
        <div class="card-body">
            <div class="table-responsive">
    {{ tables[0]|safe }}
</div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/" class="btn btn-primary">Home</a>
    </div>

</div>

</body>
</html>
